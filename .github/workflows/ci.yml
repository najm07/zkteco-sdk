name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test under a non-UTC timezone
        run: npm test
        env:
          TZ: Europe/Paris
      - run: npm run build

  package:
    name: Packed artifact on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install and import the tarball
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz
          node --input-type=module -e "
            import('@exxxp_07/zkteco-sdk').then((m) => {
              if (typeof m.ZkDevice !== 'function') process.exit(1);
              if (m.encodeDateTime(m.decodeDateTime(0x337f0e8e)) !== 0x337f0e8e) process.exit(1);
              console.log('consumer import ok');
            });
          "
