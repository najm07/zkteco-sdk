name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$expected" = "$GITHUB_REF_NAME"
      # prepublishOnly runs typecheck, tests and the build before packing.
      # Requires an npm automation token in the NPM_TOKEN repository secret.
      # After the first publish you can switch to npm trusted publishing
      # (OIDC) and remove the secret.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
